name: Test mcp-publisher install

on:
  push:

env:
  MCP_PUBLISHER_VERSION: "1.7.2"

jobs:
  test-install:
    runs-on: ubuntu-latest
    steps:
      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/v${{ env.MCP_PUBLISHER_VERSION }}/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          sudo mv mcp-publisher /usr/local/bin/mcp-publisher

      - name: Verify install
        run: mcp-publisher --version
